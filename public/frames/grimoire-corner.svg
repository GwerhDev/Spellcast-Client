<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0c988"/>
      <stop offset="30%" stop-color="#c17f3e"/>
      <stop offset="65%" stop-color="#8a5a2b"/>
      <stop offset="100%" stop-color="#4a2e14"/>
    </linearGradient>
    <radialGradient id="rivet" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f6d9a0"/>
      <stop offset="45%" stop-color="#b3762f"/>
      <stop offset="100%" stop-color="#432a13"/>
    </radialGradient>
  </defs>
  <!-- TCORE-123 follow-up: drawn top-left; mirrored via CSS transform (scaleX/scaleY -1)
       for the other 3 corners instead of another use element, since this is now its own
       standalone asset (not a defs symbol shared inside one big SVG). See
       CoverFrameCorners.tsx for where each rotation/mirror is applied. Kept at a fixed
       64x64 size everywhere it's used (never stretched), which is the whole point: a
       corner plate's rivets and curves stay perfectly round regardless of the cover's own
       aspect ratio, unlike the old single full-frame image that got squashed to fit it. -->
  <path d="M0,0 L64,0 L64,13 L34,13 C22,13 13,22 13,34 L13,64 L0,64 Z"
        fill="url(#bronze)" stroke="#3a230f" stroke-width="1.5"/>
  <path d="M0,0 L64,0 L64,13 L34,13 C22,13 13,22 13,34 L13,64 L0,64 Z"
        fill="none" stroke="#7a4d24" stroke-width="1" opacity="0.9" transform="translate(5,5) scale(0.86)"/>
  <path d="M5,5 L54,5 M5,5 L5,54" stroke="#f6d9a0" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <path d="M17,17 Q30,17 30,30 Q30,17 43,17 Q46,26 38,32 Q30,37 30,30" fill="none" stroke="#3a230f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
  <circle cx="8" cy="8" r="4.2" fill="url(#rivet)" stroke="#2e1c0c" stroke-width="0.8"/>
  <circle cx="8" cy="8" r="1.3" fill="#fbe6bc" opacity="0.8"/>
  <circle cx="54" cy="8" r="3.4" fill="url(#rivet)" stroke="#2e1c0c" stroke-width="0.7"/>
  <circle cx="8" cy="54" r="3.4" fill="url(#rivet)" stroke="#2e1c0c" stroke-width="0.7"/>
</svg>
